<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="AdaptLearn – Your personalised learning dashboard">
    <title>AdaptLearn – Dashboard</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/app.css">
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="app-wrapper">

    <!-- ── HEADER ─────────────────────────────────────────────── -->
    <header class="app-header" role="banner">

        <!-- Mobile menu trigger (hidden on desktop) -->
        <button class="icon-btn mobile-menu-btn" id="mobile-menu-btn" aria-label="Open navigation">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                <line x1="3" y1="6"  x2="21" y2="6"/>
                <line x1="3" y1="12" x2="21" y2="12"/>
                <line x1="3" y1="18" x2="21" y2="18"/>
            </svg>
        </button>

        <!-- Brand -->
        <div class="header-brand" id="header-brand">
            <div class="brand-logo" aria-hidden="true"></div>
            <span class="brand-name">
                <span class="adapt">Adapt</span><span class="learn">Learn</span>
            </span>
        </div>

        <!-- Search -->
        <div class="header-search" role="search">
            <div class="search-box">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
                    <circle cx="11" cy="11" r="8"/>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                </svg>
                <input type="search" id="global-search" placeholder="SEARCH MULTIVERSE COURSES, TOPICS, CONCEPTS..." aria-label="Search">
            </div>
        </div>

        <!-- Actions -->
        <div class="header-actions">
            <button class="icon-btn" id="theme-toggle" aria-label="Toggle theme" title="Toggle theme">
                <svg id="theme-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                    <circle cx="12" cy="12" r="5"/>
                    <line x1="12" y1="1"  x2="12" y2="3"/>
                    <line x1="12" y1="21" x2="12" y2="23"/>
                    <line x1="4.22" y1="4.22"  x2="5.64"  y2="5.64"/>
                    <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
                    <line x1="1"  y1="12" x2="3"  y2="12"/>
                    <line x1="21" y1="12" x2="23" y2="12"/>
                    <line x1="4.22" y1="19.78" x2="5.64"  y2="18.36"/>
                    <line x1="18.36" y1="5.64"  x2="19.78" y2="4.22"/>
                </svg>
            </button>

            <button class="profile-avatar" id="profile-btn" aria-label="Profile" title="Profile">B</button>
        </div>
    </header>

    <!-- ── APP BODY ───────────────────────────────────────────── -->
    <div class="app-body">

        <!-- Mobile overlay -->
        <div class="sidebar-overlay" id="sidebar-overlay" aria-hidden="true"></div>

        <!-- ── SIDEBAR ──────────────────────────────────────────── -->
        <aside class="app-sidebar" id="app-sidebar" role="navigation" aria-label="Main navigation">

            <!-- Toggle Button -->
            <button class="sidebar-toggle" id="sidebar-toggle" aria-label="Toggle sidebar" title="Toggle sidebar">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
                    <polyline points="15 18 9 12 15 6"/>
                </svg>
            </button>

            <!-- Navigation Container (dark rounded panel) -->
            <div class="nav-container">
                <nav class="sidebar-nav" aria-label="Sidebar navigation">
                <a href="#" class="nav-item active" data-tab="dashboard" id="nav-dashboard" aria-current="page">
                    <span class="nav-icon" aria-hidden="true">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="3" width="7" height="7" rx="1"/>
                            <rect x="14" y="3" width="7" height="7" rx="1"/>
                            <rect x="3" y="14" width="7" height="7" rx="1"/>
                            <rect x="14" y="14" width="7" height="7" rx="1"/>
                        </svg>
                    </span>
                    <span class="nav-label">Dashboard</span>
                </a>

                <a href="#" class="nav-item" data-tab="courses" id="nav-courses">
                    <span class="nav-icon" aria-hidden="true">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
                            <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
                        </svg>
                    </span>
                    <span class="nav-label">Courses</span>
                </a>

                <a href="#" class="nav-item" data-tab="my-learning" id="nav-my-learning">
                    <span class="nav-icon" aria-hidden="true">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/>
                            <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
                        </svg>
                    </span>
                    <span class="nav-label">My Learning</span>
                </a>

                <a href="#" class="nav-item" data-tab="revision" id="nav-revision">
                    <span class="nav-icon" aria-hidden="true">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="1 4 1 10 7 10"/>
                            <path d="M3.51 15a9 9 0 1 0 .49-3.65"/>
                        </svg>
                    </span>
                    <span class="nav-label">Revision</span>
                </a>

                <a href="#" class="nav-item" data-tab="projects" id="nav-projects">
                    <span class="nav-icon" aria-hidden="true">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
                        </svg>
                    </span>
                    <span class="nav-label">Projects</span>
                </a>

                <a href="#" class="nav-item" data-tab="interview" id="nav-interview">
                    <span class="nav-icon" aria-hidden="true">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
                        </svg>
                    </span>
                    <span class="nav-label">Interview</span>
                </a>

                <a href="#" class="nav-item" data-tab="analytics" id="nav-analytics">
                    <span class="nav-icon" aria-hidden="true">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="18" y1="20" x2="18" y2="10"/>
                            <line x1="12" y1="20" x2="12" y2="4"/>
                            <line x1="6"  y1="20" x2="6"  y2="14"/>
                        </svg>
                    </span>
                    <span class="nav-label">Analytics</span>
                </a>

                <a href="#" class="nav-item" data-tab="profile" id="nav-profile">
                    <span class="nav-icon" aria-hidden="true">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                            <circle cx="12" cy="7" r="4"/>
                        </svg>
                    </span>
                    <span class="nav-label">Profile</span>
                </a>
            </nav>
            </div><!-- /.nav-container -->

            <!-- Daily Streak Card & Bottom Nav -->
            <div class="sidebar-footer">
                <div class="daily-streak-card" aria-label="Daily Streak">
                    <div class="streak-header">
                        <span class="badge-yellow-sm">DAILY STREAK</span>
                        <span class="flame-icon">🔥</span>
                    </div>
                    <div class="streak-val-row">
                        <span class="streak-count">12</span>
                        <span class="streak-text">DAYS ACTIVE</span>
                    </div>
                </div>

                <div class="sidebar-extra-nav">
                    <a href="#" class="extra-nav-item">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                            <circle cx="12" cy="12" r="3"/>
                            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
                        </svg>
                        <span>SETTINGS</span>
                    </a>
                    <a href="index.html" class="extra-nav-item logout">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                            <polyline points="16 17 21 12 16 7"/>
                            <line x1="21" y1="12" x2="9" y2="12"/>
                        </svg>
                        <span>LOGOUT</span>
                    </a>
                </div>
            </div>
        </aside>

        <!-- ── MAIN CONTENT ──────────────────────────────────── -->
        <main class="app-main" id="app-main" role="main">

            <!-- Dashboard -->
            <section class="tab-panel active" id="panel-dashboard" aria-labelledby="nav-dashboard"></section>

            <!-- Courses -->
            <section class="tab-panel" id="panel-courses" aria-labelledby="nav-courses"></section>

            <!-- My Learning -->
            <section class="tab-panel" id="panel-my-learning" aria-labelledby="nav-my-learning"></section>

            <!-- Revision -->
            <section class="tab-panel" id="panel-revision" aria-labelledby="nav-revision"></section>

            <!-- Projects -->
            <section class="tab-panel" id="panel-projects" aria-labelledby="nav-projects"></section>

            <!-- Interview -->
            <section class="tab-panel" id="panel-interview" aria-labelledby="nav-interview"></section>

            <!-- Analytics -->
            <section class="tab-panel" id="panel-analytics" aria-labelledby="nav-analytics"></section>

            <!-- Profile -->
            <section class="tab-panel" id="panel-profile" aria-labelledby="nav-profile"></section>

            <!-- Mission (Pre-Learning Assessment & Quiz) -->
            <section class="tab-panel" id="panel-mission"></section>

        </main>
    </div><!-- /.app-body -->

    <!-- Page content renderers — load before shell -->
    <script src="pages/dashboard.js"></script>
    <script src="pages/courses.js"></script>
    <script src="pages/my-learning.js"></script>
    <script src="pages/revision.js"></script>
    <script src="pages/projects.js"></script>
    <script src="pages/interview.js"></script>
    <script src="pages/analytics.js"></script>
    <script src="pages/profile.js"></script>
    <script src="pages/mission.js"></script>
    <script src="js/shell.js"></script>
</body>
</html>
